  <rect x="50" y="14" width="28" height="28" rx="7" ry="7" fill="#ffffff" opacity="0.92"/>
  <rect x="86" y="14" width="28" height="28" rx="7" ry="7" fill="#ffffff" opacity="0.92"/>

  <!-- Row 2 -->
  <rect x="14" y="50" width="28" height="28" rx="7" ry="7" fill="#ffffff" opacity="0.92"/>
  <rect x="50" y="50" width="28" height="28" rx="7" ry="7" fill="#ffffff" opacity="0.92"/>
  <rect x="86" y="50" width="28" height="28" rx="7" ry="7" fill="#ffffff" opacity="0.92"/>

  <!-- Row 3 -->
  <rect x="14" y="86" width="28" height="28" rx="7" ry="7" fill="#ffffff" opacity="0.92"/>
  <rect x="50" y="86" width="28" height="28" rx="7" ry="7" fill="#ffffff" opacity="0.92"/>
